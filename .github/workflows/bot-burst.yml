name: auto-commenti-fb (giro lampo)

# Giro extra "ora d'oro" (solo se c'e' un post < 2h, pause piu' strette).
# DISATTIVATO come pianificazione: col cron esterno ogni 10 min il giro normale sorveglia gia' il
# post caldo ogni 5 min. Resta avviabile a mano (Actions -> Run workflow) per i post che esplodono.

on:
  workflow_dispatch: {}

# stesso gruppo del giro normale: i due non si sovrappongono mai (niente doppioni)
concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lampo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica lo stato cifrato (branch 'stato')
        env:
          STATO_KEY: ${{ secrets.STATO_KEY }}
        run: python stato_cloud.py scarica
      - name: Giro lampo (solo se post < 2h) - pause piu' strette (ora d'oro)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u reply_bot.py --ultimi-post 2 --live --max 40 --solo-se-post-recente 2 --pausa-min 15 --pausa-max 35 --like-min 2 --like-max 6
      - name: Salva lo stato cifrato (unione con il remoto, force-push sul branch 'stato')
        if: always()
        env:
          STATO_KEY: ${{ secrets.STATO_KEY }}
        run: python stato_cloud.py salva
